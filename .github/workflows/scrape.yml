name: Boiler Registry Scrape

# Runs automatically every night at 22:00 UTC (04:00 Bangladesh time).
# Each run scrapes for up to 5.25 hours, commits progress back to main,
# and exits cleanly. The full scrape (~150,000 requests) completes in
# approximately 3–4 runs. Can also be triggered manually at any time.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'   # 22:00 UTC = 04:00 Bangladesh time, daily

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # Hard 5.5-hour ceiling from GitHub Actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "scraper/requirements.txt"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        # --resume  : picks up from progress.json committed by the previous run
        # --time-limit 5.25 : stops gracefully 15 min before the 6-hour job limit
        run: python scraper/boiler_scraper.py --resume --time-limit 5.25

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper/database_export.csv \
                  scraper/records.json \
                  scraper/progress.json \
                  scraper/scraper.log
          git diff --staged --quiet \
            && echo "No new data — nothing to commit." \
            || git commit -m "scraper: checkpoint $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
